<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OG Drop — Dropping Soon</title>
  <meta name="description" content="An original OG-inspired gaming experience. Dropping soon.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      overflow:hidden;color:#fff;background:#07111f;
      min-height:100vh;display:grid;place-items:center;
    }
    .bg,.glow,.grid{position:fixed;inset:0;pointer-events:none}
    .bg{
      background:
        radial-gradient(circle at 50% 42%,rgba(42,126,255,.28),transparent 30%),
        linear-gradient(180deg,#08192d 0%,#07111f 55%,#02060d 100%);
    }
    .bg:after{
      content:"";position:absolute;inset:-20%;
      background:
        linear-gradient(115deg,transparent 42%,rgba(94,170,255,.08) 48%,transparent 54%),
        linear-gradient(65deg,transparent 45%,rgba(255,255,255,.035) 50%,transparent 55%);
      transform:rotate(-7deg);animation:pan 12s linear infinite;
    }
    .glow{
      background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.68) 90%);
    }
    .grid{
      opacity:.13;
      background-image:linear-gradient(rgba(130,190,255,.25) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(130,190,255,.25) 1px,transparent 1px);
      background-size:70px 70px;transform:perspective(500px) rotateX(62deg) scale(1.8);
      transform-origin:center bottom;
    }
    main{position:relative;text-align:center;padding:28px;z-index:2}
    .eyebrow{
      letter-spacing:.35em;font-size:12px;font-weight:800;opacity:.65;margin-bottom:18px
    }
    h1{
      margin:0;font-size:clamp(48px,10vw,120px);line-height:.88;
      font-weight:1000;letter-spacing:-.06em;
      text-shadow:0 7px 30px rgba(0,0,0,.7);
    }
    h1 span{display:block;color:#8dc7ff}
    .sub{margin:25px auto 30px;max-width:620px;color:#b7c9df;font-size:16px;line-height:1.6}
    .timer{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:30px}
    .unit{
      min-width:82px;padding:14px 12px;border:1px solid rgba(150,200,255,.18);
      background:rgba(5,16,30,.58);backdrop-filter:blur(10px);
      box-shadow:0 15px 45px rgba(0,0,0,.25)
    }
    .num{display:block;font-size:30px;font-weight:900}
    .label{font-size:9px;letter-spacing:.2em;color:#7890aa;margin-top:5px}
    .buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    a{
      color:#06111e;text-decoration:none;background:#fff;padding:14px 24px;
      font-weight:900;letter-spacing:.04em;transition:.2s;display:inline-block
    }
    a:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(90,170,255,.25)}
    .ghost{color:#dbeaff;background:rgba(255,255,255,.06);border:1px solid rgba(180,215,255,.2)}
    footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#60758d;font-size:11px;letter-spacing:.12em}
    @keyframes pan{from{transform:translateX(-8%) rotate(-7deg)}to{transform:translateX(8%) rotate(-7deg)}}
    @media(max-width:600px){
      .sub{font-size:14px}.unit{min-width:68px;padding:11px 8px}.num{font-size:24px}
      .eyebrow{font-size:9px}.buttons a{width:100%;max-width:260px}
    }
  </style>
</head>
<body>
  <div class="bg"></div><div class="grid"></div><div class="glow"></div>
  <main>
    <div class="eyebrow">A NEW ERA IS LOADING</div>
    <h1>DROPPING <span>SOON</span></h1>
    <p class="sub">The next OG-inspired gaming experience is getting ready to launch. Stay tuned — we're almost there.</p>

    <div class="timer" aria-label="Countdown">
      <div class="unit"><span class="num" id="days">00</span><span class="label">DAYS</span></div>
      <div class="unit"><span class="num" id="hours">00</span><span class="label">HOURS</span></div>
      <div class="unit"><span class="num" id="mins">00</span><span class="label">MINUTES</span></div>
      <div class="unit"><span class="num" id="secs">00</span><span class="label">SECONDS</span></div>
    </div>

    <div class="buttons">
      <a href="https://x.com/" target="_blank" rel="noopener">FOLLOW UPDATES</a>
      <a class="ghost" href="mailto:you@example.com">CONTACT</a>
    </div>
  </main>
  <footer>© 2026 OG DROP • ORIGINAL FAN PROJECT</footer>

  <script>
    // Change this date to your launch date/time.
    const launch = new Date("2026-12-31T18:00:00").getTime();
    const $ = id => document.getElementById(id);
    function tick(){
      let diff = Math.max(0, launch - Date.now());
      const d=Math.floor(diff/86400000); diff%=86400000;
      const h=Math.floor(diff/3600000); diff%=3600000;
      const m=Math.floor(diff/60000); diff%=60000;
      const s=Math.floor(diff/1000);
      $("days").textContent=String(d).padStart(2,"0");
      $("hours").textContent=String(h).padStart(2,"0");
      $("mins").textContent=String(m).padStart(2,"0");
      $("secs").textContent=String(s).padStart(2,"0");
    }
    tick(); setInterval(tick,1000);
  </script>
</body>
</html>
